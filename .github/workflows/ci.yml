name: Build and Push
on:
  push:
    branches: [master]
    paths-ignore:
      - "k8s/**"
      - "*.md"

jobs:
  build-backend:
    runs-on: homelab-runners
    steps:
      - uses: actions/checkout@v4
      - name: Login to Harbor
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "$HARBOR_PASS" | docker login registry.home.lab -u "$HARBOR_USER" --password-stdin
      - name: Build and push backend
        run: |
          docker build -t registry.home.lab/csgit34/workout-backend:${{ github.sha }} -t registry.home.lab/csgit34/workout-backend:latest -f packages/backend/Dockerfile .
          docker push registry.home.lab/csgit34/workout-backend:${{ github.sha }}
          docker push registry.home.lab/csgit34/workout-backend:latest

  build-frontend:
    runs-on: homelab-runners
    steps:
      - uses: actions/checkout@v4
      - name: Login to Harbor
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "$HARBOR_PASS" | docker login registry.home.lab -u "$HARBOR_USER" --password-stdin
      - name: Build and push frontend
        run: |
          docker build -t registry.home.lab/csgit34/workout-frontend:${{ github.sha }} -t registry.home.lab/csgit34/workout-frontend:latest -f packages/frontend/Dockerfile .
          docker push registry.home.lab/csgit34/workout-frontend:${{ github.sha }}
          docker push registry.home.lab/csgit34/workout-frontend:latest

  update-manifests:
    needs: [build-backend, build-frontend]
    runs-on: homelab-runners
    steps:
      - uses: actions/checkout@v4
      - name: Update k8s image tags and push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 7)
          sed -i "s|image: registry.home.lab/csgit34/workout-backend:.*|image: registry.home.lab/csgit34/workout-backend:${{ github.sha }}|" k8s/backend-deployment.yaml
          sed -i "s|image: registry.home.lab/csgit34/workout-frontend:.*|image: registry.home.lab/csgit34/workout-frontend:${{ github.sha }}|" k8s/frontend-deployment.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml
          git diff --staged --quiet && echo "No manifest changes" && exit 0
          git commit -m "chore: update k8s image tags to ${SHORT_SHA}"
          git push
