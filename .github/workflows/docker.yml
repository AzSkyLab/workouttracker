name: Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "packages/backend/**"
      - "packages/frontend/**"
      - "packages/shared/**"
      - "package-lock.json"
      - ".github/workflows/docker.yml"

jobs:
  changes:
    runs-on: homelab-runners
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "packages/backend/**"
              - "packages/shared/**"
              - "package-lock.json"
            frontend:
              - "packages/frontend/**"
              - "packages/shared/**"
              - "package-lock.json"

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: homelab-runners
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/azskylab/workout-backend:${{ github.sha }}
            ghcr.io/azskylab/workout-backend:latest

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: homelab-runners
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/azskylab/workout-frontend:${{ github.sha }}
            ghcr.io/azskylab/workout-frontend:latest

  update-k8s-tags:
    needs: [build-backend, build-frontend]
    if: always() && (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success')
    runs-on: homelab-runners
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Update image tags in k8s manifests
        run: |
          if [ "${{ needs.build-backend.result }}" == "success" ]; then
            sed -i "s|ghcr.io/azskylab/workout-backend:[a-zA-Z0-9._-]*|ghcr.io/azskylab/workout-backend:${GITHUB_SHA}|" k8s/backend-deployment.yaml
          fi
          if [ "${{ needs.build-frontend.result }}" == "success" ]; then
            sed -i "s|ghcr.io/azskylab/workout-frontend:[a-zA-Z0-9._-]*|ghcr.io/azskylab/workout-frontend:${GITHUB_SHA}|" k8s/frontend-deployment.yaml
          fi

      - name: Commit and push updated tags
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update k8s image tags to ${SHORT_SHA}"
          git push

      - name: Trigger ArgoCD sync
        run: |
          curl -sSf -k -X POST \
            https://argocd-server.argocd.svc.cluster.local/api/webhook \
            -H "Content-Type: application/json" \
            -d '{
              "ref": "refs/heads/master",
              "repository": {
                "clone_url": "https://github.com/azskylab/workouttracker.git"
              }
            }' || echo "ArgoCD webhook failed — will sync on next poll"
